# CI 环境配置示例：不提供任何密钥，全部由 CI secret 注入。
# 与 local 的差异：日志更详细、本地签发端点默认关闭。
app:
  env: ci

service:
  name: order-sys

http:
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 15s
  request_timeout: 10s
  max_body_bytes: 1048576
  shutdown_grace: 15s

mysql:
  dsn: ""
  max_open_conns: 10
  max_idle_conns: 5

redis:
  addr: "localhost:6379"

kafka:
  brokers:
    - "localhost:9092"
  group_id: "order-sys-ci"

log:
  level: debug

jwt:
  secret: ""
  ttl: 1h

payment:
  callback_token: ""

rate_limit:
  enabled: false
  per_user: "100/min"

# CI 不需要签发端点；需要时由 job 显式打开。
local_auth_enabled: false
