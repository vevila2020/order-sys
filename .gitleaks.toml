# gitleaks 配置：只放行误报，不放宽检测规则本身。
#
# 背景：默认规则集里的 generic-api-key 会把下面两类非敏感内容判为泄露。
# 这些文件都不含真实凭据，放行它们才能让 `make security` 与 CI 稳定通过；
# 新增放行必须逐条注明理由，禁止用宽泛的 paths 正则整目录豁免。

title = "order-sys gitleaks config"

[extend]
# 继承 gitleaks 内置规则，不重新定义规则集（避免版本升级后规则漂移）。
useDefault = true

[allowlist]
description = "全局误报放行"
paths = [
  # 本地环境变量文件由 make setup 生成，含随机密钥但已被 .gitignore 排除，
  # 永远不应进入版本库；提交历史扫描也不包含它。
  '''^\.env(\.local)?$''',
  # SBOM 由 syft 生成，内容全部是依赖坐标与 CPE，不含凭据。
  # 其中的 sourcegraph/conc 模块路径会命中 sourcegraph-access-token 规则，
  # 属于对依赖名的误判；artifacts/ 本身也已被 .gitignore 排除。
  '''^artifacts/''',
]
# 需求文档中的示例请求使用固定 UUID 作为 Idempotency-Key，
# 熵值恰好触发 generic-api-key，但它只是协议示例常量，不是密钥。
# 用精确字面量而非路径豁免，避免整份文档里的真实密钥被一起放过。
regexes = ['''0f8fad5b-d9cb-469f-a165-70867728950e''']
